<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Eq Chrome Extension</h1>
        </div>

        <div class="graph-container">
            <weq8-ui></weq8-ui>
        </div>

        <div class="preamp-container">
            <label>Pre Amp</label>
            <input type="range" min="-12" max="12" value="0" id="pre-amp">
        </div>

        <div class="master-container">
            <label>Master Volume</label>
            <input type="range" min="0" max="2" step="0.1" value="1" id="master-volume">
        </div>
    </div>
    <script type="module" src="popup.js"></script>
</body>

</html>
